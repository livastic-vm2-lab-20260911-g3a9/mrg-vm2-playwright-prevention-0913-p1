name: VM2 Stack Midflight Guard
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: vm2-stack-midflight-guard
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo VM2_STACK_MIDFLIGHT_GUARD_START
          sleep 45
          case "${{ github.event.pull_request.head.ref }}" in
            mergify/merge-queue/*)
              echo VM2_STACK_MIDFLIGHT_SYNTHETIC_FAIL
              exit 1
              ;;
          esac
          echo VM2_STACK_MIDFLIGHT_GUARD_PASS

