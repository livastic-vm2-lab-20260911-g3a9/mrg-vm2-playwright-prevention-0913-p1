name: VM2 Sentinel Chain Guard
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: vm2-sentinel-chain-guard
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "VM2_CHAIN_HEAD_REF=${GITHUB_HEAD_REF}"
          if [[ "$GITHUB_HEAD_REF" == mergify/merge-queue/* ]]; then
            echo VM2_CHAIN_SPECULATIVE_HOLD
            sleep 180
          else
            echo VM2_CHAIN_SOURCE_PASS
          fi
